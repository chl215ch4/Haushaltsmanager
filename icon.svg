<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2235"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c89ff"/>
      <stop offset="100%" stop-color="#5b6af5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5b6af5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2e3248" stroke-width="6"/>

  <!-- Glowing House Body -->
  <g filter="url(#glow)">
    <!-- House Base -->
    <path d="M140 236 L140 400 C140 412 150 422 162 422 L350 422 C362 422 372 412 372 400 L372 236 Z" fill="#22263a" stroke="#2e3248" stroke-width="4"/>
    
    <!-- House Roof -->
    <path d="M106 250 L242 128 C250 120 262 120 270 128 L406 250 C414 257 409 270 398 270 L114 270 C103 270 98 257 106 250 Z" fill="url(#roofGrad)"/>
    
    <!-- Chimney -->
    <path d="M330 180 L360 180 L360 150 L330 150 Z" fill="#5b6af5"/>

    <!-- Door / Checklist inside house -->
    <rect x="210" y="296" width="92" height="126" rx="12" fill="#151824" stroke="#5b6af5" stroke-width="4"/>
    
    <!-- Modern Checkmark inside door -->
    <path d="M228 358 L248 378 L286 332" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cart / Badge Sparkle (Top-right of house) -->
  <circle cx="392" cy="132" r="42" fill="url(#accentGrad)" filter="url(#glow)"/>
  <!-- Cart or Sparkle Icon -->
  <path d="M376 132 L388 144 L410 120" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
